services:
  mysql:
    image: mysql:8.0.41
    container_name: wearhouse-mysql
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: mysql
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      USER_DB_NAME: ${USER_DB_NAME}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME}
      CART_DB_NAME: ${CART_DB_NAME:-wearhouse_cart}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      SETTLEMENT_DB_NAME: ${SETTLEMENT_DB_NAME}
      TZ: Asia/Seoul
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-auth:
    image: redis:7.4.2
    container_name: wearhouse-redis-auth
    ports:
      - "${AUTH_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-auth-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-order:
    image: redis:7.4.2
    container_name: wearhouse-redis-order
    ports:
      - "${ORDER_REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-order-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: wearhouse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: wearhouse-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: wearhouse-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wearhouse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: wearhouse-kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    command:
      - --kafka.server=kafka:29092
      - --web.listen-address=:9308
      - --topic.filter=.*
      - --group.filter=.*
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: wearhouse-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./docker/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: wearhouse-prometheus
    depends_on:
      - kafka-exporter
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.1.5
    container_name: wearhouse-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  service-discovery:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: service-discovery
    container_name: wearhouse-service-discovery
    environment:
      EUREKA_SERVER_PORT: ${EUREKA_SERVER_PORT:-8761}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"

  config-server:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: config-server
    container_name: wearhouse-config-server
    depends_on:
      - service-discovery
    environment:
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT:-8888}
      CONFIG_REPO_LOCATIONS: ${CONFIG_REPO_LOCATIONS:-file:/config-repo}
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"

  auth-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: auth
    container_name: wearhouse-auth-service
    depends_on:
      - service-discovery
      - config-server
      - redis-auth
    environment:
      AUTH_SERVER_PORT: ${AUTH_SERVER_PORT:-8101}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-http://config-server:8888}
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-wearhouse-auth}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-wearhouse-local-jwt-secret-key-change-me-please-1234567890}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-30}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-14}
      AUTH_INTERNAL_SHARED_SECRET: ${AUTH_INTERNAL_SHARED_SECRET:-wearhouse-internal-shared-secret}
      AUTH_USER_CHANGED_CHANNEL: ${AUTH_USER_CHANGED_CHANNEL:-wearhouse.auth.user-changed.v1}
      PASSPORT_SHARED_SECRET: ${PASSPORT_SHARED_SECRET:-wearhouse-passport-shared-secret}
    ports:
      - "${AUTH_SERVER_PORT:-8101}:8101"

  user-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: user
    container_name: wearhouse-user-service
    depends_on:
      - service-discovery
      - config-server
      - auth-service
      - mysql
      - redis-auth
    environment:
      USER_SERVER_PORT: ${USER_SERVER_PORT:-8102}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-http://config-server:8888}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      USER_AUTH_BUYER_SIGNUP_URL: ${USER_AUTH_BUYER_SIGNUP_URL:-http://auth-service:8101/api/v1/internal/auth/buyers/signup}
      USER_AUTH_SELLER_SIGNUP_URL: ${USER_AUTH_SELLER_SIGNUP_URL:-http://auth-service:8101/api/v1/internal/auth/sellers/signup}
      USER_AUTH_INTERNAL_SHARED_SECRET: ${USER_AUTH_INTERNAL_SHARED_SECRET:-wearhouse-internal-shared-secret}
      PASSPORT_SHARED_SECRET: ${PASSPORT_SHARED_SECRET:-wearhouse-passport-shared-secret}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
    ports:
      - "${USER_SERVER_PORT:-8102}:8102"

  product-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: product
    container_name: wearhouse-product-service
    depends_on:
      - service-discovery
      - config-server
      - mysql
      - redis-auth
    environment:
      PRODUCT_SERVER_PORT: ${PRODUCT_SERVER_PORT:-8103}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-http://config-server:8888}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME}
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      PASSPORT_SHARED_SECRET: ${PASSPORT_SHARED_SECRET:-wearhouse-passport-shared-secret}
    ports:
      - "${PRODUCT_SERVER_PORT:-8103}:8103"

  cart-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: cart
    container_name: wearhouse-cart-service
    depends_on:
      - service-discovery
      - config-server
      - mysql
      - redis-auth
    environment:
      CART_SERVER_PORT: ${CART_SERVER_PORT:-8108}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-http://config-server:8888}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CART_DB_NAME: ${CART_DB_NAME:-wearhouse_cart}
      PASSPORT_SHARED_SECRET: ${PASSPORT_SHARED_SECRET:-wearhouse-passport-shared-secret}
    ports:
      - "${CART_SERVER_PORT:-8108}:8108"

  order-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: order
    container_name: wearhouse-order-service
    depends_on:
      - service-discovery
      - config-server
      - kafka
      - mysql
      - redis-order
    environment:
      ORDER_SERVER_PORT: ${ORDER_SERVER_PORT:-8104}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-http://config-server:8888}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      REDIS_HOST: redis-order
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TEST_TOPIC: ${KAFKA_TEST_TOPIC:-wearhouse.test.topic}
      ORDER_KAFKA_CONSUMER_GROUP: ${ORDER_KAFKA_CONSUMER_GROUP:-order-service-group}
    ports:
      - "${ORDER_SERVER_PORT:-8104}:8104"

  payment-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: payment
    container_name: wearhouse-payment-service
    depends_on:
      - service-discovery
      - config-server
      - kafka
      - mysql
      - redis-order
    environment:
      PAYMENT_SERVER_PORT: ${PAYMENT_SERVER_PORT:-8105}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-http://config-server:8888}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      REDIS_HOST: redis-order
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_KAFKA_CONSUMER_GROUP: ${PAYMENT_KAFKA_CONSUMER_GROUP:-payment-service-group}
      PAY_API_BASE_URL: ${PAY_API_BASE_URL:-https://api.kst-wallet.xyz}
      WALLET_CLIENT_KEY: ${WALLET_CLIENT_KEY}
      WALLET_SECRET_KEY: ${WALLET_SECRET_KEY}
      PAY_SECRET_KEY: ${PAY_SECRET_KEY}
    ports:
      - "${PAYMENT_SERVER_PORT:-8105}:8105"

  inventory-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: inventory
    container_name: wearhouse-inventory-service
    depends_on:
      - service-discovery
      - config-server
      - kafka
      - mysql
      - redis-order
    environment:
      INVENTORY_SERVER_PORT: ${INVENTORY_SERVER_PORT:-8106}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-http://config-server:8888}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      REDIS_HOST: redis-order
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_KAFKA_CONSUMER_GROUP: ${INVENTORY_KAFKA_CONSUMER_GROUP:-inventory-service-group}
    ports:
      - "${INVENTORY_SERVER_PORT:-8106}:8106"

  api-gateway:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        MODULE_NAME: api-gateway
    container_name: wearhouse-api-gateway
    depends_on:
      - service-discovery
      - config-server
      - auth-service
      - user-service
      - product-service
      - cart-service
      - order-service
      - redis-auth
    environment:
      API_GATEWAY_SERVER_PORT: ${API_GATEWAY_SERVER_PORT:-8000}
      API_GATEWAY_ALLOWED_ORIGINS: "${API_GATEWAY_ALLOWED_ORIGINS:-https://wear-house.shop,https://www.wear-house.shop,https://seller.wear-house.shop,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}"
      API_GATEWAY_SELLER_ORIGINS: "${API_GATEWAY_SELLER_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002}"
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://service-discovery:8761/eureka}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CLOUD_CONFIG_URI:-http://config-server:8888}
      GATEWAY_AUTH_VALIDATE_URL: ${GATEWAY_AUTH_VALIDATE_URL:-http://auth-service:8101/api/v1/internal/auth/validate}
      GATEWAY_AUTH_INTERNAL_SHARED_SECRET: ${AUTH_INTERNAL_SHARED_SECRET:-wearhouse-internal-shared-secret}
      PASSPORT_SHARED_SECRET: ${PASSPORT_SHARED_SECRET:-wearhouse-passport-shared-secret}
      AUTH_USER_CHANGED_CHANNEL: ${AUTH_USER_CHANGED_CHANNEL:-wearhouse.auth.user-changed.v1}
      PASSPORT_CACHE_TTL_SECONDS: ${PASSPORT_CACHE_TTL_SECONDS:-60}
      PASSPORT_USER_INDEX_TTL_SECONDS: ${PASSPORT_USER_INDEX_TTL_SECONDS:-1800}
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
    ports:
      - "${API_GATEWAY_SERVER_PORT:-8000}:8000"

volumes:
  mysql-data:
  redis-auth-data:
  redis-order-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
