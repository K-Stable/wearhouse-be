groups:
  - name: kafka-cluster-alerts
    rules:
      - alert: KafkaExporterDown
        expr: up{job="kafka-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka Exporter 다운"
          description: "kafka-exporter 타겟 수집이 2분 이상 실패했습니다."

      - alert: KafkaBrokerUnavailable
        expr: sum(kafka_brokers) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka Broker 비정상"
          description: "Kafka exporter 기준 활성 브로커 수가 1 미만입니다."

      - alert: KafkaConsumerLagHigh
        expr: max(kafka_consumergroup_lag) > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka Consumer Lag 급증"
          description: "consumer lag가 10,000 초과 상태로 5분 이상 유지됩니다."

  - name: order-kafka-flow-alerts
    rules:
      - alert: OrderServiceMetricsDown
        expr: up{job="order-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Order Service 메트릭 수집 실패"
          description: "order-service /actuator/prometheus 수집이 2분 이상 실패했습니다."

      - alert: OrderOutboxDeadEventsDetected
        expr: sum(wearhouse_order_outbox_event_count{status="dead"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Order Outbox DEAD 이벤트 발생"
          description: "order outbox dead 상태 이벤트가 1개 이상 감지되었습니다."
