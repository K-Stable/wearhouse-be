wearhouse:
  user:
    passport:
      shared-secret: ${PASSPORT_SHARED_SECRET:wearhouse-passport-shared-secret}
    internal:
      shared-secret: ${USER_AUTH_INTERNAL_SHARED_SECRET:${AUTH_INTERNAL_SHARED_SECRET:wearhouse-internal-shared-secret}}
    auth:
      buyer-signup-url: ${USER_AUTH_BUYER_SIGNUP_URL:http://localhost:8101/api/v1/internal/auth/buyers/signup}
      seller-signup-url: ${USER_AUTH_SELLER_SIGNUP_URL:http://localhost:8101/api/v1/internal/auth/sellers/signup}
      internal-shared-secret: ${USER_AUTH_INTERNAL_SHARED_SECRET:${AUTH_INTERNAL_SHARED_SECRET:wearhouse-internal-shared-secret}}
    cookie:
      buyer-access-name: ${AUTH_COOKIE_BUYER_ACCESS_NAME:buyer_access_token}
      seller-access-name: ${AUTH_COOKIE_SELLER_ACCESS_NAME:seller_access_token}
      buyer-refresh-name: ${AUTH_COOKIE_BUYER_REFRESH_NAME:buyer_refresh_token}
      seller-refresh-name: ${AUTH_COOKIE_SELLER_REFRESH_NAME:seller_refresh_token}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
      domain: ${AUTH_COOKIE_DOMAIN:}

spring:
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:${MAIL_SMTP_AUTH:true}}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS_ENABLE:true}}
            required: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:${MAIL_SMTP_STARTTLS_REQUIRED:true}}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:${MAIL_SMTP_CONNECTION_TIMEOUT:5000}}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT:${MAIL_SMTP_TIMEOUT:5000}}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:${MAIL_SMTP_WRITE_TIMEOUT:5000}}
