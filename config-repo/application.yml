eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: ${KAFKA_TEMPLATE_OBSERVATION_ENABLED:true}
    listener:
      observation-enabled: ${KAFKA_LISTENER_OBSERVATION_ENABLED:true}

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,env,prometheus

wearhouse:
  s3:
    enabled: ${S3_ENABLED:false}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:wearhouse-231629457117}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    presigned-put-expire-seconds: ${S3_PRESIGNED_PUT_EXPIRE_SECONDS:300}



