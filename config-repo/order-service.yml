server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_TASK_AWAIT_TERMINATION:10s}
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_SCHEDULING_AWAIT_TERMINATION:10s}
  kafka:
    consumer:
      group-id: ${ORDER_KAFKA_CONSUMER_GROUP:order-service-group}

wearhouse:
  kafka:
    common-config-enabled: ${KAFKA_COMMON_CONFIG_ENABLED:true}
    test-topic: ${KAFKA_TEST_TOPIC:wearhouse.test.topic}
    inventory-reserve-topic: ${INVENTORY_RESERVE_TOPIC:wearhouse.inventory.command.v1}
    inventory-command-topic: ${INVENTORY_COMMAND_TOPIC:wearhouse.inventory.command.v1}
    inventory-event-topic: ${INVENTORY_EVENT_TOPIC:wearhouse.inventory.event.v1}
    payment-prepare-topic: ${PAYMENT_PREPARE_TOPIC:wearhouse.payment.command.v1}
    payment-event-topic: ${PAYMENT_EVENT_TOPIC:wearhouse.payment.event.v1}
    order-event-topic: ${ORDER_EVENT_TOPIC:wearhouse.order.event.v1}
  outbox:
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:3000}
    stale-minutes: ${OUTBOX_STALE_MINUTES:10}
    republish-batch-size: ${OUTBOX_REPUBLISH_BATCH_SIZE:100}
  order:
    internal:
      shared-secret: ${ORDER_INTERNAL_SHARED_SECRET:wearhouse-order-internal-secret}
    stablepay:
      default-token-address: ${ORDER_STABLEPAY_DEFAULT_TOKEN_ADDRESS:0x0000000000000000000000000000000000000000}
      default-chain-id: ${ORDER_STABLEPAY_DEFAULT_CHAIN_ID:8453}
