wearhouse:
  kafka:
    inventory-command-topic: ${INVENTORY_COMMAND_TOPIC:wearhouse.inventory.command.v1}
    inventory-event-topic: ${INVENTORY_EVENT_TOPIC:wearhouse.inventory.event.v1}
    order-event-topic: ${ORDER_EVENT_TOPIC:wearhouse.order.event.v1}
  inventory:
    reservation-hold-minutes: ${INVENTORY_RESERVATION_HOLD_MINUTES:15}
    optimistic-retry-count: ${INVENTORY_OPTIMISTIC_RETRY_COUNT:3}
    reservation-expire-interval-ms: ${INVENTORY_RESERVATION_EXPIRE_INTERVAL_MS:30000}
    reservation-expire-batch-size: ${INVENTORY_RESERVATION_EXPIRE_BATCH_SIZE:200}
    hot-skus: ${INVENTORY_HOT_SKUS:}
    lock:
      wait-time-ms: ${INVENTORY_LOCK_WAIT_TIME_MS:1200}
      lease-time-ms: ${INVENTORY_LOCK_LEASE_TIME_MS:3000}
      retry-interval-ms: ${INVENTORY_LOCK_RETRY_INTERVAL_MS:40}
      key-prefix: ${INVENTORY_LOCK_KEY_PREFIX:inventory:lock:sku:}
    cache:
      stock-ttl-seconds: ${INVENTORY_STOCK_CACHE_TTL_SECONDS:30}
      stock-key-prefix: ${INVENTORY_STOCK_CACHE_KEY_PREFIX:inventory:stock:available:}
    kafka:
      send-timeout-ms: ${INVENTORY_KAFKA_SEND_TIMEOUT_MS:3000}

spring:
  kafka:
    consumer:
      group-id: ${INVENTORY_KAFKA_CONSUMER_GROUP:inventory-service-group}
