server:
  port: ${ORDER_SERVER_PORT:8104}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_TASK_AWAIT_TERMINATION:10s}
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_SCHEDULING_AWAIT_TERMINATION:10s}
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  application:
    name: order-service
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${ORDER_DB_NAME:wearhouse_order}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:wearhouse}
    password: ${MYSQL_PASSWORD:wearhouse_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    listener:
      missing-topics-fatal: false
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${ORDER_KAFKA_CONSUMER_GROUP:order-service-group}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

wearhouse:
  kafka:
    common-config-enabled: true
    error-handler:
      retry-interval-ms: ${KAFKA_RETRY_INTERVAL_MS:2000}
      retry-attempts: ${KAFKA_RETRY_ATTEMPTS:3}
      dlt-topic: ${KAFKA_DLT_TOPIC:wearhouse.kafka.failure.order.v1}
    test-topic: ${KAFKA_TEST_TOPIC:wearhouse.test.topic}
    inventory-reserve-topic: ${INVENTORY_RESERVE_TOPIC:wearhouse.inventory.command.v1}
    inventory-command-topic: ${INVENTORY_COMMAND_TOPIC:wearhouse.inventory.command.v1}
    inventory-event-topic: ${INVENTORY_EVENT_TOPIC:wearhouse.inventory.event.v1}
    payment-prepare-topic: ${PAYMENT_PREPARE_TOPIC:wearhouse.payment.command.v1}
    payment-event-topic: ${PAYMENT_EVENT_TOPIC:wearhouse.payment.event.v1}
    order-event-topic: ${ORDER_EVENT_TOPIC:wearhouse.order.event.v1}
  order:
    passport:
      shared-secret: ${PASSPORT_SHARED_SECRET:wearhouse-passport-shared-secret}
    internal:
      shared-secret: ${ORDER_INTERNAL_SHARED_SECRET:wearhouse-order-internal-secret}
    reserve-wait-timeout-ms: ${ORDER_RESERVE_WAIT_TIMEOUT_MS:2000}
    reserve-wait-interval-ms: ${ORDER_RESERVE_WAIT_INTERVAL_MS:100}
    payment-confirm-wait-timeout-ms: ${ORDER_PAYMENT_CONFIRM_WAIT_TIMEOUT_MS:3000}
    payment-confirm-wait-interval-ms: ${ORDER_PAYMENT_CONFIRM_WAIT_INTERVAL_MS:100}
    payment-prepare-wait-timeout-ms: ${ORDER_PAYMENT_PREPARE_WAIT_TIMEOUT_MS:3000}
    payment-prepare-wait-interval-ms: ${ORDER_PAYMENT_PREPARE_WAIT_INTERVAL_MS:100}
    payment-prepare-success-url-template: ${ORDER_PAYMENT_PREPARE_SUCCESS_URL_TEMPLATE:https://mall.wearhouse.com/orders/{orderNo}/payments/success}
    payment-prepare-fail-url-template: ${ORDER_PAYMENT_PREPARE_FAIL_URL_TEMPLATE:https://mall.wearhouse.com/orders/{orderNo}/payments/fail}
  outbox:
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:3000}
    stale-minutes: ${OUTBOX_STALE_MINUTES:10}
    republish-batch-size: ${OUTBOX_REPUBLISH_BATCH_SIZE:100}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: order-service
