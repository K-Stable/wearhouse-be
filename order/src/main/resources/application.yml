server:
  port: ${ORDER_SERVER_PORT:8104}

spring:
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  application:
    name: order-service
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${ORDER_DB_NAME:wearhouse_order}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:wearhouse}
    password: ${MYSQL_PASSWORD:wearhouse_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    listener:
      missing-topics-fatal: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${ORDER_KAFKA_CONSUMER_GROUP:order-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

wearhouse:
  kafka:
    test-topic: ${KAFKA_TEST_TOPIC:wearhouse.test.topic}
    inventory-reserve-topic: ${INVENTORY_RESERVE_TOPIC:wearhouse.inventory.command.v1}
    inventory-command-topic: ${INVENTORY_COMMAND_TOPIC:wearhouse.inventory.command.v1}
    inventory-event-topic: ${INVENTORY_EVENT_TOPIC:wearhouse.inventory.event.v1}
    payment-prepare-topic: ${PAYMENT_PREPARE_TOPIC:wearhouse.payment.command.v1}
    payment-event-topic: ${PAYMENT_EVENT_TOPIC:wearhouse.payment.event.v1}
    order-event-topic: ${ORDER_EVENT_TOPIC:wearhouse.order.event.v1}
  order:
    passport:
      shared-secret: ${PASSPORT_SHARED_SECRET:wearhouse-passport-shared-secret}
    payment-result-timeout-minutes: ${ORDER_PAYMENT_RESULT_TIMEOUT_MINUTES:30}
  outbox:
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:3000}
    stale-minutes: ${OUTBOX_STALE_MINUTES:10}
    republish-interval-ms: ${OUTBOX_REPUBLISH_INTERVAL_MS:60000}
    republish-batch-size: ${OUTBOX_REPUBLISH_BATCH_SIZE:100}
    retry:
      max-retries: ${OUTBOX_MAX_RETRIES:3}
      exponential:
        initial-delay-ms: ${OUTBOX_RETRY_INITIAL_DELAY_MS:2000}
        max-delay-ms: ${OUTBOX_RETRY_MAX_DELAY_MS:60000}
        multiplier: ${OUTBOX_RETRY_MULTIPLIER:2.0}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: order-service
