apiVersion: v1
kind: ConfigMap
metadata:
  name: wearhouse-env
  namespace: wearhouse
data:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  AUTH_DB_NAME: wearhouse_auth
  USER_DB_NAME: wearhouse_user
  PRODUCT_DB_NAME: wearhouse_product
  CART_DB_NAME: wearhouse_cart
  ORDER_DB_NAME: wearhouse_order
  PAYMENT_DB_NAME: wearhouse_payment
  INVENTORY_DB_NAME: wearhouse_inventory
  SETTLEMENT_DB_NAME: wearhouse_settlement
  REDIS_HOST: redis-auth
  REDIS_PORT: "6379"
  AUTH_REDIS_PORT: "6379"
  ORDER_REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TEST_TOPIC: wearhouse.test.topic
  EUREKA_SERVER_PORT: "8761"
  EUREKA_DEFAULT_ZONE: http://service-discovery:8761/eureka
  CONFIG_SERVER_PORT: "8888"
  SPRING_CLOUD_CONFIG_URI: http://config-server:8888
  CONFIG_REPO_LOCATIONS: file:/config-repo
  API_GATEWAY_SERVER_PORT: "8000"
  API_GATEWAY_ALLOWED_ORIGINS: http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
  API_GATEWAY_SELLER_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
  GATEWAY_AUTH_VALIDATE_URL: http://auth-service:8101/api/v1/internal/auth/validate
  AUTH_SERVER_PORT: "8101"
  USER_SERVER_PORT: "8102"
  USER_AUTH_BUYER_SIGNUP_URL: http://auth-service:8101/api/v1/internal/auth/buyers/signup
  USER_AUTH_SELLER_SIGNUP_URL: http://auth-service:8101/api/v1/internal/auth/sellers/signup
  USER_AUTH_INTERNAL_SHARED_SECRET: wearhouse-internal-shared-secret
  PRODUCT_SERVER_PORT: "8103"
  CART_SERVER_PORT: "8108"
  ORDER_SERVER_PORT: "8104"
  PAYMENT_SERVER_PORT: "8105"
  INVENTORY_SERVER_PORT: "8106"
  SETTLEMENT_SERVER_PORT: "8107"
  ORDER_KAFKA_CONSUMER_GROUP: order-service-group
  PAYMENT_KAFKA_CONSUMER_GROUP: payment-service-group
  INVENTORY_KAFKA_CONSUMER_GROUP: inventory-service-group
  AUTH_JWT_ISSUER: wearhouse-auth
  AUTH_ACCESS_TOKEN_MINUTES: "30"
  AUTH_REFRESH_TOKEN_TTL_DAYS: "14"
  AUTH_COOKIE_BUYER_ACCESS_NAME: buyer_access_token
  AUTH_COOKIE_SELLER_ACCESS_NAME: seller_access_token
  AUTH_COOKIE_BUYER_REFRESH_NAME: buyer_refresh_token
  AUTH_COOKIE_SELLER_REFRESH_NAME: seller_refresh_token
  AUTH_COOKIE_SECURE: "false"
  AUTH_COOKIE_SAME_SITE: Lax
  AUTH_USER_CHANGED_CHANNEL: wearhouse.auth.user-changed.v1
  PASSPORT_CACHE_TTL_SECONDS: "60"
  PASSPORT_USER_INDEX_TTL_SECONDS: "1800"
  SPRING_MAIL_HOST: smtp.gmail.com
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_SMTP_STARTTLS_ENABLE: "true"
  S3_ENABLED: "false"
  S3_REGION: ap-northeast-2
  S3_BUCKET: wearhouse-231629457117
  S3_PUBLIC_BASE_URL: ""
  S3_PRESIGNED_PUT_EXPIRE_SECONDS: "300"
  PRODUCT_IMAGE_KEY_PREFIX: dev
  ORDER_INTERNAL_SHARED_SECRET: wearhouse-order-internal-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: wearhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0.41
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          value: mysql
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wearhouse-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: wearhouse-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wearhouse-secrets
              key: MYSQL_PASSWORD
        - name: AUTH_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wearhouse-env
              key: AUTH_DB_NAME
        - name: USER_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wearhouse-env
              key: USER_DB_NAME
        - name: PRODUCT_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wearhouse-env
              key: PRODUCT_DB_NAME
        - name: CART_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wearhouse-env
              key: CART_DB_NAME
        - name: ORDER_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wearhouse-env
              key: ORDER_DB_NAME
        - name: PAYMENT_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wearhouse-env
              key: PAYMENT_DB_NAME
        - name: INVENTORY_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wearhouse-env
              key: INVENTORY_DB_NAME
        - name: SETTLEMENT_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wearhouse-env
              key: SETTLEMENT_DB_NAME
        args:
        - --default-authentication-plugin=mysql_native_password
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        volumeMounts:
        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d/01-init-databases.sh
          subPath: 01-init-databases.sh
        - name: mysql-data
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-init
        configMap:
          name: wearhouse-mysql-init
          defaultMode: 0755
      - name: mysql-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: wearhouse
spec:
  selector:
    app: mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-auth
  namespace: wearhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-auth
  template:
    metadata:
      labels:
        app: redis-auth
    spec:
      containers:
      - name: redis
        image: redis:7.4.2
        args: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-auth
  namespace: wearhouse
spec:
  selector:
    app: redis-auth
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
