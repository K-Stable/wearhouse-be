server:
  port: ${EUREKA_SERVER_PORT:8761}

spring:
  application:
    name: service-discovery

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${server.port}/eureka}
  server:
    enable-self-preservation: false
