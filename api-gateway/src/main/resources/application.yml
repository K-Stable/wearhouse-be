server:
  port: ${API_GATEWAY_SERVER_PORT:8000}

spring:
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  application:
    name: api-gateway
  cloud:
    config:
      fail-fast: false
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: auth-service-compat
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/api/v1/auth/**
              filters:
                - StripPrefix=1
            - id: auth-service-internal
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/internal/auth/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
            - id: user-service-compat
              uri: lb://user-service
              predicates:
                - Path=/user-service/api/v1/users/**
              filters:
                - StripPrefix=1
            - id: user-service-internal
              uri: lb://user-service
              predicates:
                - Path=/api/v1/internal/users/**
            - id: product-service-buyer
              uri: lb://product-service
              predicates:
                - Path=/api/v1/buyer/products/**
            - id: product-service-seller
              uri: lb://product-service
              predicates:
                - Path=/api/v1/seller/products/**
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/buyer/carts/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            - id: order-service-seller
              uri: lb://order-service
              predicates:
                - Path=/api/v1/seller/orders/**
            - id: order-service-compat
              uri: lb://order-service
              predicates:
                - Path=/order-service/api/v1/orders/**,/order-service/api/v1/seller/orders/**
              filters:
                - StripPrefix=1
            - id: order-service-internal
              uri: lb://order-service
              predicates:
                - Path=/api/v1/internal/kafka/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
            - id: inventory-service-seller
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/seller/inventories/**
            - id: inventory-service-internal
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/internal/inventory/**
            - id: settlement-service
              uri: lb://settlement-service
              predicates:
                - Path=/api/v1/settlements/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

wearhouse:
  auth:
    jwt:
      issuer: ${AUTH_JWT_ISSUER:wearhouse-auth}
      secret: ${AUTH_JWT_SECRET:wearhouse-local-jwt-secret-key-change-me-please-1234567890}
  cors:
    allowed-origins: ${API_GATEWAY_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
    allowed-origin-patterns: ${API_GATEWAY_ALLOWED_ORIGIN_PATTERNS:}
  gateway:
    auth:
      internal-shared-secret: ${GATEWAY_AUTH_INTERNAL_SHARED_SECRET:wearhouse-internal-shared-secret}
    passport:
      shared-secret: ${PASSPORT_SHARED_SECRET:wearhouse-passport-shared-secret}
      cache-ttl-seconds: ${PASSPORT_CACHE_TTL_SECONDS:60}
      user-index-ttl-seconds: ${PASSPORT_USER_INDEX_TTL_SECONDS:1800}
      user-changed-channel: ${AUTH_USER_CHANGED_CHANNEL:wearhouse.auth.user-changed.v1}
    seller-origins: ${API_GATEWAY_SELLER_ORIGINS:http://localhost:3002,http://127.0.0.1:3002}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
