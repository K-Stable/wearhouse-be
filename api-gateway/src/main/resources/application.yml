server:
  port: ${API_GATEWAY_SERVER_PORT:8000}

spring:
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  application:
    name: api-gateway
  cloud:
    config:
      fail-fast: false
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/**
              filters:
                - StripPrefix=1
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user-service/**
              filters:
                - StripPrefix=1
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/product-service/**
              filters:
                - StripPrefix=1
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order-service/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payment-service/**
              filters:
                - StripPrefix=1
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/inventory-service/**
              filters:
                - StripPrefix=1
            - id: settlement-service
              uri: lb://settlement-service
              predicates:
                - Path=/settlement-service/**
              filters:
                - StripPrefix=1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

wearhouse:
  cors:
    allowed-origins: ${API_GATEWAY_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
  gateway:
    auth:
      validate-url: ${GATEWAY_AUTH_VALIDATE_URL:http://localhost:8101/api/v1/internal/auth/validate}
      internal-shared-secret: ${GATEWAY_AUTH_INTERNAL_SHARED_SECRET:wearhouse-internal-shared-secret}
    passport:
      shared-secret: ${PASSPORT_SHARED_SECRET:wearhouse-passport-shared-secret}
      cache-ttl-seconds: ${PASSPORT_CACHE_TTL_SECONDS:60}
      user-index-ttl-seconds: ${PASSPORT_USER_INDEX_TTL_SECONDS:1800}
      user-changed-channel: ${AUTH_USER_CHANGED_CHANNEL:wearhouse.auth.user-changed.v1}
    cookie:
      buyer-access-name: ${AUTH_COOKIE_BUYER_ACCESS_NAME:buyer_access_token}
      seller-access-name: ${AUTH_COOKIE_SELLER_ACCESS_NAME:seller_access_token}
    seller-origins: ${API_GATEWAY_SELLER_ORIGINS:http://localhost:3002,http://127.0.0.1:3002}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
