server:
  port: ${AUTH_SERVER_PORT:8101}

spring:
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  application:
    name: auth-service
  cloud:
    config:
      fail-fast: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

wearhouse:
  auth:
    jwt:
      issuer: ${AUTH_JWT_ISSUER:wearhouse-auth}
      secret: ${AUTH_JWT_SECRET:wearhouse-local-jwt-secret-key-change-me-please-1234567890}
      access-token-minutes: ${AUTH_ACCESS_TOKEN_MINUTES:30}
    refresh:
      ttl-days: ${AUTH_REFRESH_TOKEN_TTL_DAYS:14}
      key-prefix: ${AUTH_REFRESH_TOKEN_KEY_PREFIX:rt:}
    cookie:
      buyer-refresh-name: ${AUTH_COOKIE_BUYER_REFRESH_NAME:buyer_refresh_token}
      seller-refresh-name: ${AUTH_COOKIE_SELLER_REFRESH_NAME:seller_refresh_token}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
      domain: ${AUTH_COOKIE_DOMAIN:}
    internal:
      shared-secret: ${AUTH_INTERNAL_SHARED_SECRET:wearhouse-internal-shared-secret}
    pubsub:
      user-changed-channel: ${AUTH_USER_CHANGED_CHANNEL:wearhouse.auth.user-changed.v1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
