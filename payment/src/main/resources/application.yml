server:
  port: ${PAYMENT_SERVER_PORT:8105}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_TASK_AWAIT_TERMINATION:10s}
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: ${SPRING_SCHEDULING_AWAIT_TERMINATION:10s}
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  application:
    name: payment-service
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${PAYMENT_DB_NAME:wearhouse_payment}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:wearhouse}
    password: ${MYSQL_PASSWORD:wearhouse_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    listener:
      missing-topics-fatal: false
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${PAYMENT_KAFKA_CONSUMER_GROUP:payment-service-group}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

wearhouse:
  kafka:
    common-config-enabled: true
    error-handler:
      retry-interval-ms: ${KAFKA_RETRY_INTERVAL_MS:2000}
      retry-attempts: ${KAFKA_RETRY_ATTEMPTS:3}
      dlt-topic: ${KAFKA_DLT_TOPIC:wearhouse.kafka.failure.payment.v1}
    payment-prepare-topic: ${PAYMENT_PREPARE_TOPIC:wearhouse.payment.command.v1}
    payment-event-topic: ${PAYMENT_EVENT_TOPIC:wearhouse.payment.event.v1}
  payment:
    passport:
      shared-secret: ${PASSPORT_SHARED_SECRET:wearhouse-passport-shared-secret}
    kafka:
      send-timeout-ms: ${PAYMENT_KAFKA_SEND_TIMEOUT_MS:3000}
    mock:
      pending-timeout-minutes: ${PAYMENT_MOCK_PENDING_TIMEOUT_MINUTES:30}
      timeout-check-interval-ms: ${PAYMENT_MOCK_TIMEOUT_CHECK_INTERVAL_MS:10000}
      timeout-batch-size: ${PAYMENT_MOCK_TIMEOUT_BATCH_SIZE:200}
      fail-methods: ${PAYMENT_MOCK_FAIL_METHODS:FAIL}
      timeout-methods: ${PAYMENT_MOCK_TIMEOUT_METHODS:TIMEOUT}
  order:
    internal:
      shared-secret: ${ORDER_INTERNAL_SHARED_SECRET:wearhouse-order-internal-secret}
  pay:
    api-base-url: ${WALLET_API_BASE_URL:https://api.kst-wallet.xyz}
    secret-key: ${WALLET_SECRET_KEY:pay_secret_key}
    timeout-ms: ${PAY_TIMEOUT_MS:10000}
    confirm-path: ${PAY_CONFIRM_PATH:/api/v1/merchant/payments/confirm}
    prepare-path: ${PAY_PREPARE_PATH:/api/v1/merchant/checkout-sessions}
    webhook:
      secret: ${PAY_WEBHOOK_SECRET:pay-webhook-secret}
      allowed-skew-seconds: ${PAY_WEBHOOK_ALLOWED_SKEW_SECONDS:300}
  outbox:
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:3000}
    stale-minutes: ${OUTBOX_STALE_MINUTES:10}
    republish-batch-size: ${OUTBOX_REPUBLISH_BATCH_SIZE:100}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: payment-service
