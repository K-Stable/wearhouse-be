server:
  port: ${PAYMENT_SERVER_PORT:8105}

spring:
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  application:
    name: payment-service
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${PAYMENT_DB_NAME:wearhouse_payment}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:wearhouse}
    password: ${MYSQL_PASSWORD:wearhouse_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    listener:
      missing-topics-fatal: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${PAYMENT_KAFKA_CONSUMER_GROUP:payment-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

wearhouse:
  kafka:
    payment-prepare-topic: ${PAYMENT_PREPARE_TOPIC:wearhouse.payment.command.v1}
    payment-event-topic: ${PAYMENT_EVENT_TOPIC:wearhouse.payment.event.v1}
  payment:
    passport:
      shared-secret: ${PASSPORT_SHARED_SECRET:wearhouse-passport-shared-secret}
    kafka:
      send-timeout-ms: ${PAYMENT_KAFKA_SEND_TIMEOUT_MS:3000}
    mock:
      pending-timeout-minutes: ${PAYMENT_MOCK_PENDING_TIMEOUT_MINUTES:30}
      timeout-check-interval-ms: ${PAYMENT_MOCK_TIMEOUT_CHECK_INTERVAL_MS:10000}
      timeout-batch-size: ${PAYMENT_MOCK_TIMEOUT_BATCH_SIZE:200}
      fail-methods: ${PAYMENT_MOCK_FAIL_METHODS:FAIL}
      timeout-methods: ${PAYMENT_MOCK_TIMEOUT_METHODS:TIMEOUT}
  outbox:
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:3000}
    stale-minutes: ${OUTBOX_STALE_MINUTES:10}
    republish-interval-ms: ${OUTBOX_REPUBLISH_INTERVAL_MS:60000}
    republish-batch-size: ${OUTBOX_REPUBLISH_BATCH_SIZE:100}
    retry:
      max-retries: ${OUTBOX_MAX_RETRIES:3}
      exponential:
        initial-delay-ms: ${OUTBOX_RETRY_INITIAL_DELAY_MS:2000}
        max-delay-ms: ${OUTBOX_RETRY_MAX_DELAY_MS:60000}
        multiplier: ${OUTBOX_RETRY_MULTIPLIER:2.0}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: payment-service
