server:
  port: ${USER_SERVER_PORT:8102}

spring:
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  application:
    name: user-service
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${USER_DB_NAME:wearhouse_user}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:wearhouse}
    password: ${MYSQL_PASSWORD:wearhouse_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:no-reply@wearhouse.local}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

wearhouse:
  user:
    passport:
      shared-secret: ${PASSPORT_SHARED_SECRET:wearhouse-passport-shared-secret}
    internal:
      shared-secret: ${USER_AUTH_INTERNAL_SHARED_SECRET:${AUTH_INTERNAL_SHARED_SECRET:wearhouse-internal-shared-secret}}
    auth:
      buyer-signup-url: ${USER_AUTH_BUYER_SIGNUP_URL:http://localhost:8101/api/v1/internal/auth/buyers/signup}
      seller-signup-url: ${USER_AUTH_SELLER_SIGNUP_URL:http://localhost:8101/api/v1/internal/auth/sellers/signup}
      internal-shared-secret: ${USER_AUTH_INTERNAL_SHARED_SECRET:${AUTH_INTERNAL_SHARED_SECRET:wearhouse-internal-shared-secret}}
    cookie:
      buyer-access-name: ${AUTH_COOKIE_BUYER_ACCESS_NAME:buyer_access_token}
      seller-access-name: ${AUTH_COOKIE_SELLER_ACCESS_NAME:seller_access_token}
      buyer-refresh-name: ${AUTH_COOKIE_BUYER_REFRESH_NAME:buyer_refresh_token}
      seller-refresh-name: ${AUTH_COOKIE_SELLER_REFRESH_NAME:seller_refresh_token}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
